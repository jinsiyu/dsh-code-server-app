# 本仓库自身的 pnpm 配置(显式、可提交;不再由 pnpm 自动写占位值)。
#
# 依赖安装**不执行任何 postinstall**(本仓库只需 esbuild + motion 打包):
#   - esbuild 的 postinstall 只是校验/补齐平台二进制,optionalDependencies 已带,
#     忽略构建后 `pnpm run build:client` 正常(实测);
#   - 其余条目来自 peerDependencies 自动安装的 DSH 运行时(打包/开发都用不到),
#     显式写 false 是为了让 pnpm 11 不再报 ERR_PNPM_IGNORED_BUILDS(该错误会让 install 退出 1)。
packages:
  - .
allowBuilds:
  esbuild: false
  '@deepseek-ai/dsh-subprocess-local': false
  '@google/genai': false
  koffi: false
  node-pty: false
  protobufjs: false
minimumReleaseAgeExclude:
  - '@jinsiyu/dsh-code-server-runtime-win32-arm64@0.3.10'
  - '@jinsiyu/dsh-code-server-runtime-win32-x64@0.3.10'
  - '@jinsiyu/dshcs-kerberos-win32-arm64@2.1.1-dshcs.1'
  - '@jinsiyu/dshcs-kerberos-win32-x64@2.1.1-dshcs.1'
  # Linux 目标首批 10 个子包(2026-09-17 首发):刚发布的版本会被供应链冷却期挡住,
  # 和我们自己发的包一样列进排除表;以后每次首发新子包/新版本都要在这里补一行。
  - '@jinsiyu/dshcs-kerberos-linux-arm64@2.1.1-dshcs.1'
  - '@jinsiyu/dshcs-kerberos-linux-x64@2.1.1-dshcs.1'
  - '@jinsiyu/dshcs-vscode-deviceid-linux-arm64@0.1.5'
  - '@jinsiyu/dshcs-vscode-deviceid-linux-x64@0.1.5'
  - '@jinsiyu/dshcs-vscode-native-watchdog-linux-arm64@1.4.6'
  - '@jinsiyu/dshcs-vscode-native-watchdog-linux-x64@1.4.6'
  - '@jinsiyu/dshcs-vscode-spdlog-linux-arm64@0.15.8'
  - '@jinsiyu/dshcs-vscode-spdlog-linux-x64@0.15.8'
  - '@jinsiyu/dshcs-vscode-sqlite3-linux-arm64@5.1.12-vscode'
  - '@jinsiyu/dshcs-vscode-sqlite3-linux-x64@5.1.12-vscode'
