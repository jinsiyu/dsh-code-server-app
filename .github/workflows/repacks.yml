          code=${PIPESTATUS[0]}
          echo "repack 退出码 $code"
          if [ "$code" -ne 0 ]; then
            echo "::error::repack 失败(exit $code);下面把报错行与日志尾部转成 annotation"
            grep -E 'Error|error:|✗|失败|未生成|throw|ENOENT|EACCES' "$RUNNER_TEMP/repack.log" | tail -n 10 \
              | while IFS= read -r line; do echo "::error:: $line"; done
            tail -n 8 "$RUNNER_TEMP/repack.log" | while IFS= read -r line; do echo "::error:: $line"; done
            exit "$code"
          fi

      - name: 结论(产物清单,公开可读)
        shell: bash
        run: |
          tgz="$RUNNER_TEMP/repacks/repack/tgz"
          count=$(ls -1 "$tgz"/*.tgz 2>/dev/null | wc -l | tr -d ' ')
          echo "::notice::$TARGET 产出 $count 个 tgz"
          for f in "$tgz"/*.tgz; do
            [ -e "$f" ] || continue
            echo "::notice::  $(basename "$f") $(( $(stat -c%s "$f") / 1024 ))KB"
          done
          echo "---- 待发布目录(repack/build)----"
          ls -1 "$RUNNER_TEMP/repacks/repack/build" || true

      - name: 生成的依赖表与仓库里的一致吗(平台政策应当宿主无关)
        shell: bash
        run: |
          mismatch=0
          for f in lib/vendored.json package.json; do
            if diff -q "$GITHUB_WORKSPACE/$f" "$RUNNER_TEMP/repacks/$f" >/dev/null 2>&1; then
              echo "::notice::$TARGET 上生成的 $f 与仓库里的完全一致"
            else
              mismatch=$((mismatch + 1))
              echo "::warning::$TARGET 上生成的 $f 与仓库里的不一致(平台政策本应宿主无关)"
              diff -u "$GITHUB_WORKSPACE/$f" "$RUNNER_TEMP/repacks/$f" | head -n 12 \
                | while IFS= read -r line; do echo "::warning:: $line"; done || true
            fi
          done
          # 这一步**只出信息,不判失败**:生成物由维护者在 Windows 上产出后提交,这里要回答的是
          # 「换宿主平台会不会算出不同的表」,而不是拦住构建。两类差异要分开看:
          #   · lib/vendored.json 不一致 = 平台政策没做到宿主无关(warning,真问题);
          #   · package.json 不一致多半是**上游纯 JS 直装依赖**的 patch 漂移(notice):
          #     它们的版本取自源树,而树里的版本一定来自 npm ⇒ 跟着树走是安全的;这种差异是
          #     **时间**相关(同一 commit 换一天全新装就可能不同),不是宿主相关。
          #     只有在 diff 里看到 @jinsiyu/dshcs-* 子包版本时才是真问题(那是我们自己发布的号)。
          for f in lib/vendored.json package.json; do
