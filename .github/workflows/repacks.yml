  # ── OIDC 通道巡检(只暂存,不发正式版)─────────────────────────────────────────────
  # 证明「per-package trusted publishing(OIDC)」对 @jinsiyu/dshcs-* 真的可用 —— 这条通道
  # 只能在 CI 里验证(OIDC 令牌运行时才签发,信任关系按「仓库 + workflow 文件名 + 包名」匹配),
  # 所以巡检必须由**这个文件**发起(25 条 Trusted Publisher 的 workflow 都填的 repacks.yml)。
  # 细节与安全边界见文件头「OIDC 通道巡检」;探针逻辑在 scripts/oidc-probe.mjs。
  probe-oidc:
    name: OIDC 通道巡检(staged,不发正式版)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出
        uses: actions/checkout@v7

      - name: 安装 Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # 两种启用方式:手动 dispatch 勾 probe_oidc;或仓库里存在哨兵文件 .github/oidc-probe.enabled
      # (push 事件下 inputs 为空 ⇒ 只能靠哨兵,好处是无需任何令牌即可触发)。
      - name: 判定是否启用
        id: gate
        shell: bash
        run: |
          if [ "${{ inputs.probe_oidc }}" = "true" ] || [ -f .github/oidc-probe.enabled ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "OIDC 巡检:启用(staged publishing,不会产生正式版本)"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "OIDC 巡检:未启用(dispatch 未勾 probe_oidc,且仓库里没有 .github/oidc-probe.enabled)⇒ 跳过"
          fi

      - name: 确认 npm 支持 staged publishing
        if: steps.gate.outputs.enabled == 'true'
        run: |
          node --version
          npm --version
          if npm stage --help >/dev/null 2>&1; then
            echo "npm stage 可用"
          else
            echo "::error::这个 npm 不支持 staged publishing(需要 npm ≥ 11.6)⇒ 巡检无法进行"
            exit 1
          fi

      - name: staged 探针发布(只暂存)
        if: steps.gate.outputs.enabled == 'true'
        run: node scripts/oidc-probe.mjs

      - name: 汇总
        if: always()
        run: |
          {
            echo "### OIDC 通道巡检(staged publishing)"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 启用 | \`${{ steps.gate.outputs.enabled }}\` |"
            echo "| 触发 | \`${{ github.event_name }}\` |"
            echo "| 结论 | 见 annotation 与日志(脚本退出码即结论) |"
            echo ""
            echo "> 暂存版本不会进入正式版本列表;验证完请在 npm 的 staged publishes 里 **reject**(不要 approve)。"
          } >> "$GITHUB_STEP_SUMMARY"
