# repacks.yml —— 平台专属重打包包(`@jinsiyu/dshcs-*[-<平台>-<架构>]`)的构建 / 发布。
#
# 为什么单独一个工作流、而且默认不发布:
#   · 这批包只在**换 VS Code 树版本**时才需要重打(见 README「升级 VS Code 树」),不是每次改动都发;
#   · 一次完整重打要:从 registry 取 code-server@<钉住版本>(53MB)→ 裁成 vendor/vscode(197MB)→
#     再装一棵**完整源树**用于分析(npm install + lib/vscode 内部依赖 ≈1GB)→ 用宿主编译链
#     `npm rebuild` 编译原生包 → npm pack 出十几个 tgz。所以手动 `workflow_dispatch` 触发,
#     默认 `publish=false`(只构建 + 传 artifact),要发才显式打开。
#
# 每个目标都跑在**同架构宿主 runner** 上(R5 与 linux probe 同思路,避免 node-gyp 跨架构那堆坑):
#   win32-x64   → windows-latest
#   win32-arm64 → windows-11-arm
#   linux-x64   → ubuntu-latest
#   linux-arm64 → ubuntu-24.04-arm
#   若某个标签在你的仓库不可用,job 会一直排队 —— 取消它,然后用对应的 build_*=false 只跑其它的。
#
# 产物归属(**避免并发发布撞车**):平台无关的 8 个包(xterm/koffi/node-pty/ssh2/…)四个目标都会产出,
# 内容一致 ⇒ 约定**只由 win32-x64 那条腿发布**(其余三条腿用 `--only <自己的目标>` 只发平台专属包),
# 这样集合不相交、可以并发:
#   · win32-x64    :不带 --only ⇒ 发布「平台无关 + win32-x64 专用」(树包已存在会被自动跳过);
#   · win32-arm64  :`--only win32-arm64`;
#   · linux-x64    :`--only linux-x64`(构建时再加 `--skip-independent`,见下);
#   · linux-arm64  :`--only linux-arm64`(同上)。
# 三条非 x64 的腿都加 `--skip-independent`:平台无关包只由 win32-x64 腿**产出**,其它腿重打它们纯属浪费,
#   而且会把「在别的宿主上打出来的同名包」塞进 artifact —— 谁从 artifact 手工发布,发出去的就是错内容。
# 哪些模块在 Linux 上有子包,由 scripts/repack-platforms.json 的每模块白名单决定
#   (上游不写 os/cpu,只能人工声明);某目标上编不出 .node 的会被自动跳过并打一行结论。
#
# 硬闸门(0.3.48 起):scripts/vendor-repacks.mjs 收尾会核对「声明里承诺的『模块×目标』是否都真的产出了
#   子包」,缺一个就**判失败**。为什么需要:`npm rebuild` 的失败是容错的(单个原生包编不出来不该卡住
#   整条链),没有闸门时它会静默退化成「这个模块被当成平台无关、打成不带目标后缀的包」,而依赖表里
#   照旧写着「每目标一份」⇒ CI 绿着发出去一套装不起来的东西(2026-09-16 由"为什么日志里有 npm error
#   仍然通过"暴露:Linux 腿上 spdlog/sqlite3/kerberos 都 npm error,承诺 5 个只产出 2 个)。
#   现在原生包是**逐个 rebuild** 的(整树 rebuild 会在第一个失败处中断、级联坑掉后面的包),
#   失败逐条打出来,最后再由闸门判定。
#
# 认证(两条路都支持,workflow 自己判断):
#   A. `NPM_TOKEN`(仓库 Secrets;粒度令牌:对 `@jinsiyu` 作用域有 publish 权限 + 勾 bypass 2FA)
#      —— 最省事,但 npm 已公告 **2027-01 起 bypass-2FA 令牌将失去直接发布**(只剩读取 + 暂存发布,
#      要维护者用 2FA 批准)。所以它是"现在能用、以后要迁"的方案。
#   B. **per-package trusted publishing(OIDC)**:给每个子包各加一条 Trusted Publisher
#      (workflow 填 `repacks.yml`,environment 留空)。npm 的信任关系是**按包**配的(2026-09 起
#      一个包可以配多条,但**没有作用域级**),这批有 25 个包 ⇒ 25 条。一条循环(浏览器授权一次后可连续跑):
#        for p in @jinsiyu/dshcs-cpu-features @jinsiyu/dshcs-kerberos-win32-arm64 … ; do
#          npm trust github "$p" --file repacks.yml --allow-publish -y; done
#      (完整包名列表 = lib/vendored.json 的 modules × targets + @jinsiyu/dshcs-vscode-server)
#   没配 NPM_TOKEN 时,下面的发布步骤直接走 OIDC(不再写 .npmrc)。
#
# 用法(手动触发,见 Actions → repacks → Run workflow):
#   build_x64 / build_arm64 / build_linux_x64 / build_linux_arm64(默认都是 true)
#                        → 选择跑哪几条腿(Linux 腿默认也开:这是「加入 Linux 适配」后的常规动作)
#   publish=false(默认) → 只构建 + 上传 repack/tgz/*.tgz
#   publish=true         → 构建完再发布到 npm(dist_tag 默认 next;latest 仍由 promote 手动推进)
#   probe_oidc=true      → 只跑「OIDC 通道巡检」job:对几个真实子包名做 staged(暂存)发布,
#                          验证 OIDC ↔ Trusted Publisher 是否真的通(不产生任何正式版本)。
#
# OIDC 通道巡检(probe_oidc / 哨兵文件):
#   为什么必须有它:OIDC 通道**无法离线验证** —— 令牌只在 CI 运行时签发,而且信任关系按
#   「仓库 + workflow 文件名 + 包名」匹配;唯一诚实的验证是对真实包名发起一次发布请求。
#   为什么不直接 publish:那会占用真实版本号。这里用 npm 的 **staged publishing**
#   (`npm stage publish`,npm ≥ 11.6):版本进暂存队列、**不进** registry 的正式版本列表,
#   走的是与 `npm publish` 完全相同的认证路径;验证完维护者 `npm stage reject <id>` 作废即可。
#   脚本还会自己核对:探针版本没有出现在正式版本列表里(scripts/oidc-probe.mjs)。
#   触发方式:① dispatch 勾 probe_oidc;② 提交 `.github/oidc-probe.enabled`(哨兵)后 push
#   —— 后者不需要任何令牌,便于用匿名 API 核对运行结果。
name: repacks

on:
  workflow_dispatch:
    inputs:
      build_x64:
        description: 构建 win32-x64(windows-latest)
        type: boolean
        default: true
      build_arm64:
        description: 构建 win32-arm64(windows-11-arm)
        type: boolean
        default: true
      build_linux_x64:
        description: 构建 linux-x64(ubuntu-latest)
        type: boolean
        default: true
      build_linux_arm64:
        description: 构建 linux-arm64(ubuntu-24.04-arm)
        type: boolean
        default: true
      publish:
        description: 构建完成后发布到 npm(需要仓库 Secrets 里的 NPM_TOKEN)
        type: boolean
        default: false
      dist_tag:
        description: 发布用的 dist-tag(政策:默认 next,不碰 latest)
        type: string
        default: next
      probe_oidc:
        description: 【巡检】只对几个真实子包名做 staged(暂存)发布,验证 OIDC 通道是否可用(不产生正式版本)
        type: boolean
        default: false
  # 本文件被改动时自动跑一次**只构建**的演练(方便验证这个工作流本身);
  # publish 的输入在 push 事件下为空 ⇒ 永远为 false。
  push:
    paths:
      - '.github/workflows/repacks.yml'
      # 哨兵文件:提交它即触发一次 OIDC 巡检(见文件尾「OIDC 通道巡检」)。平时仓库里没有这个文件。
      - '.github/oidc-probe.enabled'

concurrency:
  group: repacks-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # 子包走 OIDC(per-package trusted publishing)时需要

jobs:
  win32-x64:
    name: repacks win32-x64 (+ 平台无关包)
    if: github.event_name == 'push' || inputs.build_x64
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      TARGET: win32-x64
      DIST_TAG: ${{ inputs.dist_tag }}
    steps:
      - name: 检出
        uses: actions/checkout@v7

      - name: 安装 Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # vendor-repacks 会重写 lib/vendored.json 与插件 package.json(那是它的正常职责)⇒ 在副本里跑,
      # 不弄脏检出(与 linux 探针同一做法)。脚本只用 Node 内置模块 ⇒ 副本不需要 node_modules。
      - name: 复制仓库到 $RUNNER_TEMP(不弄脏检出)
        shell: pwsh
        run: |
          $dst = Join-Path $env:RUNNER_TEMP 'repacks'
          New-Item -ItemType Directory -Force $dst | Out-Null
          git archive HEAD | tar -x -C $dst
          Write-Host "副本:$dst"
          Get-ChildItem $dst | Select-Object -ExpandProperty Name

      - name: 钉版本准备 vendor/vscode(与 dependencies 里钉的树版本一致)
        shell: pwsh
        working-directory: ${{ runner.temp }}/repacks
        run: |
          $V = node -e "const p=require('$env:GITHUB_WORKSPACE/package.json');const k=Object.keys(p.dependencies).filter(n=>/\/dshcs-vscode-server$/.test(n));if(k.length!==1){console.error('树包应恰好一个:',k);process.exit(1)}process.stdout.write(p.dependencies[k[0]])"
          Write-Host "内置树版本(code-server):$V"
          node scripts/vendor-vscode-server.mjs --version $V
          if (-not (Test-Path vendor\vscode\lib\vscode\out\server-main.js)) { throw 'vendor/vscode 不完整' }

      - name: 重打打包(--pack)
        shell: pwsh
        working-directory: ${{ runner.temp }}/repacks
        run: |
          $ErrorActionPreference = 'Continue'
          node scripts/vendor-repacks.mjs --target $env:TARGET --pack 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\repack.log"
          $code = $LASTEXITCODE
          Write-Host "repack 退出码 $code"
          if ($code -ne 0) {
            Write-Host "::error::repack 失败(exit $code);下面把报错行与日志尾部转成 annotation"
            Select-String -Path "$env:RUNNER_TEMP\repack.log" -Pattern 'Error|error:|✗|失败|未生成|throw|ENOENT|EACCES' |
              Select-Object -Last 10 | ForEach-Object { Write-Host "::error:: $($_.Line)" }
            Get-Content "$env:RUNNER_TEMP\repack.log" -Tail 8 | ForEach-Object { Write-Host "::error:: $_" }
            exit $code
          }

      - name: 结论(产物清单,公开可读)
        shell: pwsh
        run: |
          $tgz = Join-Path $env:RUNNER_TEMP 'repacks\repack\tgz'
          $files = if (Test-Path $tgz) { Get-ChildItem $tgz -Filter *.tgz | Sort-Object Name } else { @() }
          Write-Host "::notice::$env:TARGET 产出 $($files.Count) 个 tgz"
          foreach ($f in $files) { Write-Host "::notice::  $($f.Name) $([math]::Round($f.Length/1KB,1))KB" }
          Write-Host "---- 待发布目录(repack/build)----"
          Get-ChildItem (Join-Path $env:RUNNER_TEMP 'repacks\repack\build') -Directory |
            Select-Object -ExpandProperty Name

      - name: 上传 tgz
        uses: actions/upload-artifact@v7
        with:
          name: repacks-${{ env.TARGET }}
          if-no-files-found: error
          retention-days: 30
          path: ${{ runner.temp }}/repacks/repack/tgz/*.tgz

      # 发布:平台无关的 8 个包 + 本目标的平台专属包(arm64 那条腿用 --only 只发自己的,见文件头)。
      - name: 发布到 npm(不含平台无关以外的包;已存在的版本自动跳过)
        if: inputs.publish
        shell: pwsh
        working-directory: ${{ runner.temp }}/repacks
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if ($env:NPM_TOKEN) {
            "//registry.npmjs.org/:_authToken=$env:NPM_TOKEN" | Out-File -FilePath .npmrc -Encoding ascii -NoNewline
            Write-Host "认证:NPM_TOKEN(已写入 .npmrc,publish-repacks.mjs 会 --userconfig 指向它)"
          } else {
            Write-Host "认证:OIDC trusted publishing(没配 NPM_TOKEN)⇒ 每个子包都需要一条 Trusted Publisher,workflow 名 repacks.yml"
          }
          $ErrorActionPreference = 'Continue'
          node scripts/publish-repacks.mjs --tag $env:DIST_TAG 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\publish.log"
          $code = $LASTEXITCODE
          Remove-Item .npmrc -Force -ErrorAction SilentlyContinue
          if ($code -ne 0) {
            Write-Host "::error::发布失败(exit $code)"
            Select-String -Path "$env:RUNNER_TEMP\publish.log" -Pattern 'npm error|npm ERR|403|404|409|E402|EPUBLISH|ENEEDAUTH|EOTP|forbidden|trusted|token 体检|whoami' |
              Select-Object -Last 10 | ForEach-Object { Write-Host "::error:: $($_.Line)" }
            exit $code
          }

      - name: 汇总
        if: always()
        run: |
          {
            echo "### repacks / ${{ env.TARGET }}"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| runner | \`${{ runner.os }} / windows-latest\` |"
            echo "| 目标 | \`${{ env.TARGET }}\` |"
            echo "| 发布 | \`${{ inputs.publish }}\`(dist-tag \`${{ inputs.dist_tag }}\`) |"
            echo "| 触发 | \`${{ github.event_name }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  win32-arm64:
    name: repacks win32-arm64
    if: github.event_name == 'push' || inputs.build_arm64
    runs-on: windows-11-arm
    timeout-minutes: 120
    env:
      TARGET: win32-arm64
      DIST_TAG: ${{ inputs.dist_tag }}
    steps:
      - name: 检出
        uses: actions/checkout@v7

      - name: 安装 Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 复制仓库到 $RUNNER_TEMP(不弄脏检出)
        shell: pwsh
        run: |
          $dst = Join-Path $env:RUNNER_TEMP 'repacks'
          New-Item -ItemType Directory -Force $dst | Out-Null
          git archive HEAD | tar -x -C $dst
          Write-Host "副本:$dst"

      - name: 钉版本准备 vendor/vscode(与 dependencies 里钉的树版本一致)
        shell: pwsh
        working-directory: ${{ runner.temp }}/repacks
        run: |
          $V = node -e "const p=require('$env:GITHUB_WORKSPACE/package.json');const k=Object.keys(p.dependencies).filter(n=>/\/dshcs-vscode-server$/.test(n));if(k.length!==1){console.error('树包应恰好一个:',k);process.exit(1)}process.stdout.write(p.dependencies[k[0]])"
          Write-Host "内置树版本(code-server):$V"
          node scripts/vendor-vscode-server.mjs --version $V
          if (-not (Test-Path vendor\vscode\lib\vscode\out\server-main.js)) { throw 'vendor/vscode 不完整' }

      - name: 重打打包(--pack)
        shell: pwsh
        working-directory: ${{ runner.temp }}/repacks
        run: |
          $ErrorActionPreference = 'Continue'
          # --skip-independent:平台无关包只由 win32-x64 腿产出(本腿只发 --only win32-arm64,
          # 重打它们纯属浪费,还会把「在别的宿主上打出来的同名包」塞进 artifact)。
          node scripts/vendor-repacks.mjs --target $env:TARGET --pack --skip-independent 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\repack.log"
          $code = $LASTEXITCODE
          Write-Host "repack 退出码 $code"
          if ($code -ne 0) {
            Write-Host "::error::repack 失败(exit $code);下面把报错行与日志尾部转成 annotation"
            Select-String -Path "$env:RUNNER_TEMP\repack.log" -Pattern 'Error|error:|✗|失败|未生成|throw|ENOENT|EACCES' |
              Select-Object -Last 10 | ForEach-Object { Write-Host "::error:: $($_.Line)" }
            Get-Content "$env:RUNNER_TEMP\repack.log" -Tail 8 | ForEach-Object { Write-Host "::error:: $_" }
            exit $code
          }

      - name: 结论(产物清单,公开可读)
        shell: pwsh
        run: |
          $tgz = Join-Path $env:RUNNER_TEMP 'repacks\repack\tgz'
          $files = if (Test-Path $tgz) { Get-ChildItem $tgz -Filter *.tgz | Sort-Object Name } else { @() }
          Write-Host "::notice::$env:TARGET 产出 $($files.Count) 个 tgz"
          foreach ($f in $files) { Write-Host "::notice::  $($f.Name) $([math]::Round($f.Length/1KB,1))KB" }

      - name: 上传 tgz
        uses: actions/upload-artifact@v7
        with:
          name: repacks-${{ env.TARGET }}
          if-no-files-found: error
          retention-days: 30
          path: ${{ runner.temp }}/repacks/repack/tgz/*.tgz

      # 只发本目标的平台专属包(平台无关的那些由 win32-x64 那条腿发,避免两边抢同一个包名)。
      - name: 发布到 npm(只发 win32-arm64 专用)
        if: inputs.publish
        shell: pwsh
        working-directory: ${{ runner.temp }}/repacks
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if ($env:NPM_TOKEN) {
            "//registry.npmjs.org/:_authToken=$env:NPM_TOKEN" | Out-File -FilePath .npmrc -Encoding ascii -NoNewline
            Write-Host "认证:NPM_TOKEN"
          } else {
            Write-Host "认证:OIDC trusted publishing(没配 NPM_TOKEN)⇒ 每个子包都需要一条 Trusted Publisher,workflow 名 repacks.yml"
          }
          $ErrorActionPreference = 'Continue'
          node scripts/publish-repacks.mjs --tag $env:DIST_TAG --only win32-arm64 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\publish.log"
          $code = $LASTEXITCODE
          Remove-Item .npmrc -Force -ErrorAction SilentlyContinue
          if ($code -ne 0) {
            Write-Host "::error::发布失败(exit $code)"
            Select-String -Path "$env:RUNNER_TEMP\publish.log" -Pattern 'npm error|npm ERR|403|404|409|E402|EPUBLISH|ENEEDAUTH|EOTP|forbidden|trusted|token 体检|whoami' |
              Select-Object -Last 10 | ForEach-Object { Write-Host "::error:: $($_.Line)" }
            exit $code
          }

      - name: 汇总
        if: always()
        run: |
          {
            echo "### repacks / ${{ env.TARGET }}"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| runner | \`windows-11-arm\` |"
            echo "| 目标 | \`${{ env.TARGET }}\` |"
            echo "| 发布 | \`${{ inputs.publish }}\`(--only win32-arm64) |"
            echo "| 触发 | \`${{ github.event_name }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Linux 腿(linux-x64 / linux-arm64)──────────────────────────────────────────────
  # 与 win32 腿同构,区别只有三处:
  #   · 宿主换成同架构 Ubuntu runner(原生包现编,避免跨架构工具链);
  #   · 只发自己的平台专属包(`--only linux-x64` / `--only linux-arm64`)—— 平台无关的 8 个包
  #     由 win32-x64 腿发布,四个目标内容一致,不能四边抢同一个版本号;
  #   · 多一步「生成的依赖表与仓库里的是否一致」:平台政策(scripts/repack-platforms.json)
  #     的设计目标就是**宿主无关**,Linux 上跑出来的 lib/vendored.json / package.json
  #     理应与 Windows 上一致;不一致就发 warning + diff 片段(不需要令牌即可读)。
  # 哪些模块在 Linux 上有子包:白名单里给 linux-* 的模块;某目标上编不出 .node 的自动跳过,
  # 每个目标一行结论(`[repack] linux-x64: 平台专属产出 N 个(…)`)会同时以 notice 发出来。
  linux-x64:
    name: repacks linux-x64
    if: github.event_name == 'push' || inputs.build_linux_x64
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TARGET: linux-x64
      DIST_TAG: ${{ inputs.dist_tag }}
    steps:
      - name: 检出
        uses: actions/checkout@v7

      - name: 安装 Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 复制仓库到 $RUNNER_TEMP(不弄脏检出)
        shell: bash
        run: |
          dst="$RUNNER_TEMP/repacks"
          rm -rf "$dst"; mkdir -p "$dst"
          git archive HEAD | tar -x -C "$dst"
          echo "副本:$dst"

      - name: 钉版本准备 vendor/vscode(与 dependencies 里钉的树版本一致)
        shell: bash
        working-directory: ${{ runner.temp }}/repacks
        run: |
          V=$(node -e "const p=require(process.env.GITHUB_WORKSPACE+'/package.json');const k=Object.keys(p.dependencies).filter(n=>/\/dshcs-vscode-server$/.test(n));if(k.length!==1){console.error('树包应恰好一个:',k);process.exit(1)}process.stdout.write(p.dependencies[k[0]])")
          echo "内置树版本(code-server):$V"
          node scripts/vendor-vscode-server.mjs --version "$V"
          test -f vendor/vscode/lib/vscode/out/server-main.js \
            || { echo "::error::vendor/vscode 不完整(缺 out/server-main.js)"; exit 1; }

      # kerberos 这个原生包要 GSSAPI 头(../src/unix/kerberos_gss.h → gssapi/gssapi.h),
      # Ubuntu runner 上默认没有 ⇒ 不装就是 make 失败、kerberos 的子包产不出来(硬闸门会判失败)。
      # 2026-09-16 由 Linux 腿第一次跑硬闸门时暴露。
      - name: 装原生包需要的系统头文件(kerberos → libkrb5-dev)
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libkrb5-dev
          test -f /usr/include/gssapi/gssapi.h || { echo "::error::libkrb5-dev 装完仍找不到 gssapi/gssapi.h"; exit 1; }
          echo "gssapi 头就位"

      - name: 重打打包(--pack)
        shell: bash
        working-directory: ${{ runner.temp }}/repacks
        run: |
          set +e
          node scripts/vendor-repacks.mjs --target "$TARGET" --pack --skip-independent 2>&1 | tee "$RUNNER_TEMP/repack.log"
          code=${PIPESTATUS[0]}
          echo "repack 退出码 $code"
          if [ "$code" -ne 0 ]; then
            echo "::error::repack 失败(exit $code);下面把报错行与日志尾部转成 annotation"
            grep -E 'Error|error:|✗|失败|未生成|throw|ENOENT|EACCES' "$RUNNER_TEMP/repack.log" | tail -n 10 \
              | while IFS= read -r line; do echo "::error:: $line"; done
            tail -n 8 "$RUNNER_TEMP/repack.log" | while IFS= read -r line; do echo "::error:: $line"; done
            exit "$code"
          fi

      - name: 结论(产物清单,公开可读)
        shell: bash
        run: |
          tgz="$RUNNER_TEMP/repacks/repack/tgz"
          count=$(ls -1 "$tgz"/*.tgz 2>/dev/null | wc -l | tr -d ' ')
          echo "::notice::$TARGET 产出 $count 个 tgz"
          for f in "$tgz"/*.tgz; do
            [ -e "$f" ] || continue
            echo "::notice::  $(basename "$f") $(( $(stat -c%s "$f") / 1024 ))KB"
          done
          echo "---- 待发布目录(repack/build)----"
          ls -1 "$RUNNER_TEMP/repacks/repack/build" || true

      - name: 生成的依赖表与仓库里的一致吗(平台政策应当宿主无关)
        shell: bash
        run: |
          mismatch=0
          for f in lib/vendored.json package.json; do
            if diff -q "$GITHUB_WORKSPACE/$f" "$RUNNER_TEMP/repacks/$f" >/dev/null 2>&1; then
              echo "::notice::$TARGET 上生成的 $f 与仓库里的完全一致"
            else
              mismatch=$((mismatch + 1))
              echo "::warning::$TARGET 上生成的 $f 与仓库里的不一致(平台政策本应宿主无关)"
              diff -u "$GITHUB_WORKSPACE/$f" "$RUNNER_TEMP/repacks/$f" | head -n 12 \
                | while IFS= read -r line; do echo "::warning:: $line"; done || true
            fi
          done
          # 这一步**只出信息,不判失败**:生成物由维护者在 Windows 上产出后提交,这里要回答的是
          # 「换宿主平台会不会算出不同的表」,而不是拦住构建。两类差异要分开看:
          #   · lib/vendored.json 不一致 = 平台政策没做到宿主无关(warning,真问题);
          #   · package.json 不一致多半是**上游纯 JS 直装依赖**的 patch 漂移(notice):
          #     它们的版本取自源树,而树里的版本一定来自 npm ⇒ 跟着树走是安全的;这种差异是
          #     **时间**相关(同一 commit 换一天全新装就可能不同),不是宿主相关。
          #     只有在 diff 里看到 @jinsiyu/dshcs-* 子包版本时才是真问题(那是我们自己发布的号)。
          for f in lib/vendored.json package.json; do
            if diff -q "$GITHUB_WORKSPACE/$f" "$RUNNER_TEMP/repacks/$f" >/dev/null 2>&1; then
              echo "::notice::$TARGET 上生成的 $f 与仓库里的完全一致"
            elif [ "$f" = "package.json" ]; then
              echo "::notice::$TARGET 上生成的 package.json 与仓库里有差异(多半是上游 JS 依赖的 patch 漂移,时间相关;若是 @jinsiyu/dshcs-* 版本则要查)"
              diff -u "$GITHUB_WORKSPACE/$f" "$RUNNER_TEMP/repacks/$f" | head -n 12 \
                | while IFS= read -r line; do echo "::notice:: $line"; done || true
            else
              mismatch=$((mismatch + 1))
              echo "::warning::$TARGET 上生成的 $f 与仓库里的不一致(平台政策本应宿主无关)"
              diff -u "$GITHUB_WORKSPACE/$f" "$RUNNER_TEMP/repacks/$f" | head -n 12 \
                | while IFS= read -r line; do echo "::warning:: $line"; done || true
            fi
          done
          if [ "$mismatch" -gt 0 ]; then
            echo "::warning::$TARGET:有 $mismatch 个生成文件与仓库不一致(信息,不判失败)"
          fi
          exit 0

      - name: 上传 tgz
        uses: actions/upload-artifact@v7
        with:
          name: repacks-linux-x64
          if-no-files-found: error
          retention-days: 30
          path: ${{ runner.temp }}/repacks/repack/tgz/*.tgz

      # 只发本目标的平台专属包(平台无关的那些由 win32-x64 那条腿发,避免四边抢同一个包名)。
      - name: 发布到 npm(只发 linux-x64 专用)
        if: inputs.publish
        shell: bash
        working-directory: ${{ runner.temp }}/repacks
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            printf '//registry.npmjs.org/:_authToken=%s' "$NPM_TOKEN" > .npmrc
            echo "认证:NPM_TOKEN(已写入 .npmrc,publish-repacks.mjs 会 --userconfig 指向它)"
          else
            echo "认证:OIDC trusted publishing(没配 NPM_TOKEN)⇒ 每个子包都需要一条 Trusted Publisher,workflow 名 repacks.yml"
          fi
          set +e
          node scripts/publish-repacks.mjs --tag "$DIST_TAG" --only "$TARGET" 2>&1 | tee "$RUNNER_TEMP/publish.log"
          code=${PIPESTATUS[0]}
          rm -f .npmrc
          if [ "$code" -ne 0 ]; then
            echo "::error::发布失败(exit $code)"
            grep -E 'npm error|npm ERR|403|404|409|E402|EPUBLISH|ENEEDAUTH|EOTP|forbidden|trusted|token 体检|whoami' "$RUNNER_TEMP/publish.log" \
              | tail -n 10 | while IFS= read -r line; do echo "::error:: $line"; done
            exit "$code"
          fi

      - name: 汇总
        if: always()
        run: |
          {
            echo "### repacks / ${{ env.TARGET }}"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| runner | \`ubuntu-latest\` |"
            echo "| 目标 | \`${{ env.TARGET }}\` |"
            echo "| 发布 | \`${{ inputs.publish }}\`(--only ${{ env.TARGET }}) |"
            echo "| 触发 | \`${{ github.event_name }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  linux-arm64:
