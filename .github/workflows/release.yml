# release.yml —— 推 `v<version>` 标签即:重建 tarball → 全量回归 → **在真 DSH 里真装一遍** →
# 发 npm `next` → 建 GitHub Release(附 tgz)。
#
# 三个 job 的分工(为什么拆开):
#   · `build`(ubuntu):门禁 + 构建 + 打包 + 传 tarball 产物。tarball 是平台无关的
#     (VENDOR.json 里的 platform 字段只是元数据),所以在哪个平台打都一样。
#   · `install-smoke`(**windows**):拿刚打出来的 tgz,部署真 DSH、走官方安装路径装进 profile,
#     再断言"装完真的能用"。**必须在 windows 上跑**:本产品目前只发 win32 原生子包
#     (16 个平台专属重打包包 = 8 模块 × win32-arm64/x64,子包自带 os/cpu),在 Linux 上 pnpm 会
#     按 os 字段跳过它们 ⇒ Linux 上的安装冒烟根本验不到 0.3.45 那类"optional 子树被丢包 /
#     requires missing bindings"的问题。第一次跑(0.3.47)就是因为把它放在 ubuntu 上而被门禁拦住 ——
#     拦得对,但平台得换。
#   · `publish`(ubuntu):**needs: [build, install-smoke]** ⇒ 前两步全过才会发 npm。
#     非 tag 触发(workflow_dispatch 演练)时这一步整段跳过:演练会真跑构建与安装冒烟,但绝不发布。
#
# 与 README「dist-tag 政策」的关系(不变):
#   · 本工作流**只发 `next`**,绝不碰 `latest`;`latest` 仍由 `pnpm run promote -- <version>`
#     在用户重启 dsh web 确认无误后手动推进。
#   · 发的是**同一 commit + 同一个钉死的 VS Code 树版本**重建出来的 tarball。与"本机验证过的那份"
#     唯一差异是 vendor/VENDOR.json 里的 platform / preparedAt / sizeMB 这类元数据(运行时只消费
#     codeServerVersion 与 productPath,见 lib/vendor.js)。
#
# 为什么必须显式 `--version <pinned>`:
#   全新 clone 上 `pnpm pack` 的 prepack 会跑 vendor-vscode-server,而它在没有本地源树时会去 registry
#   取 `code-server@latest` ⇒ VENDOR.json 与 dependencies 里钉的 `@jinsiyu/dshcs-vscode-server@<版本>`
#   不同步 ⇒ test-vendored-table 的「树包精确钉版本」断言失败。这里先按 package.json 的钉法把树
#   准备好,prepack 因此变成 no-op(它仍会重跑一次 build:webview,幂等)。
#
# 认证:npm trusted publishing(OIDC,`id-token: write`)优先,无需长期凭据;
#   需要在 npmjs.com 上把包 `dsh-code-server-app` 的 Trusted Publisher 指到本仓库 + 本文件名
#   (本文件:release.yml;Environment name 留空 —— 本工作流的 job 不声明 environment)。
#   备选:仓库 Secrets 加 `NPM_TOKEN`,并设仓库 Variables 的 `NPM_AUTH_MODE=token`(则不发 provenance)。
name: release

on:
  push:
    tags: ['v*']
  # 演练:完整跑一遍(build + 安装冒烟 + 上传 tgz 产物),但**不发布、不建 Release**。
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # gh release create
  id-token: write # npm trusted publishing(provenance)

jobs:
  # ============================================================ 构建 + 门禁 + 打包
  build:
    name: build + gates (${{ github.ref_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.ver.outputs.version }}
    env:
      # 可选:当前部署里 @deepseek-ai/dsh-web-frontend 的版本(设了才做下面的 UI 版本守卫)
      DSH_UI_VERSION: ${{ vars.DSH_UI_VERSION }}
    steps:
      - name: 检出
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6

      - name: 安装 Node 24 并缓存 pnpm store
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: 读出本版本号
        id: ver
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      # ---- 门禁 1:tag 与 package.json.version 必须一致 --------------------------------------
      - name: 版本守卫(tag == package.json.version)
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p 'require("./package.json").version')"
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG 与 package.json 的 $PKG 不一致;请改 package.json 或重打 tag"
            exit 1
          fi

      # ---- 门禁 2:该版本不能已经在 npm 上(npm 版本不可变) ---------------------------------
      # 演练(workflow_dispatch)时只告警:那时 package.json 的版本按设计可能已发布过。
      - name: 重复发布守卫(版本是否已在 npm)
        run: |
          V="$(node -p 'require("./package.json").version')"
          if npm view "dsh-code-server-app@$V" version >/dev/null 2>&1; then
            if [ "${{ github.event_name }}" = "push" ]; then
              echo "::error::dsh-code-server-app@$V 已在 npm 上,不能重复发布;请 bump 版本后重新打 tag"
              exit 1
            fi
            echo "::warning::dsh-code-server-app@$V 已发布(演练中,仅提示)"
          else
            echo "版本 $V 尚未发布"
          fi

      - name: 安装依赖(--frozen-lockfile)
        run: pnpm install --frozen-lockfile

      # ---- 把 VS Code 树钉到 package.json 里声明的那一版 ------------------------------------
      - name: 解析树包版本(dependencies 里唯一的 dshcs-vscode-server)
        id: tree
        run: |
          set -euo pipefail
          TREE="$(node -e 'const p=require("./package.json");const k=Object.keys(p.dependencies).filter(n=>/\/dshcs-vscode-server$/.test(n));if(k.length!==1){console.error("dependencies 里 dshcs-vscode-server 应恰好一个:",k);process.exit(1)}process.stdout.write(p.dependencies[k[0]])')"
          echo "tree_version=$TREE"
          echo "tree_version=$TREE" >> "$GITHUB_OUTPUT"

      - name: 准备内置 VS Code 树(显式钉版本,不取上游 latest)
        run: node scripts/vendor-vscode-server.mjs --version "${{ steps.tree.outputs.tree_version }}"

      - name: 构建 client bundle
        run: pnpm run build:client

      # 必须在回归之前:test-webview-bundle 见到产物才真验(缺产物时它逐项 SKIP)。
      # 后面 pnpm pack 的 prepack 会再跑一次(幂等)。
      - name: 构建「问 DSH」面板 webview
        run: pnpm run build:webview

      # ---- 门禁 3:全套回归(与 ci.yml 同一份清单)-------------------------------------------
      - name: 全量回归(pnpm test)
        env:
          DSHCS_SUITE_LOG: ${{ runner.temp }}/suite.log
        run: pnpm run test

      # ---- 门禁 4:面板渲染器必须与部署的 DSH 界面同版本 --------------------------------------
      # 本地 build:webview 会自动比对部署;runner 上没有 DSH 部署 ⇒ 这一步靠仓库变量补上,
      # 未配置时只告警(不会静默通过:summary 里明确写"未校验")。
      - name: UI 版本守卫(渲染器 vs 部署的 DSH 界面)
        run: |
          set -euo pipefail
          if [ -z "${DSH_UI_VERSION:-}" ]; then
            echo "::warning::未设置仓库变量 DSH_UI_VERSION ⇒ 跳过部署 UI 版本校验(本地 build:webview 会做这一步)"
            echo "ui_version_check=skipped(未配置 DSH_UI_VERSION)" >> "$GITHUB_ENV"
            exit 0
          fi
          HAVE="$(node -p 'require("./package.json").devDependencies["@deepseek-ai/dsh-client-ui-primitives"]')"
          echo "部署 UI=$DSH_UI_VERSION 渲染器=$HAVE"
          if [ "$HAVE" != "$DSH_UI_VERSION" ]; then
            echo "::error::面板渲染器是 $HAVE,部署的 DSH 界面是 $DSH_UI_VERSION —— 面板排版会不一致;请把 devDependencies 的两个 @deepseek-ai/dsh-client-ui-* 升到 $DSH_UI_VERSION"
            exit 1
          fi
          echo "ui_version_check=ok($HAVE)" >> "$GITHUB_ENV"

      - name: 打包(pnpm pack;prepack 对树是 no-op,会重跑 build:webview)
        run: |
          set -euo pipefail
          pnpm pack

      # ---- 门禁 5:tarball 必须含 package.json files 里声明的每一条 --------------------------
      - name: 校验 tarball 清单
        run: |
          set -euo pipefail
          V="$(node -p 'require("./package.json").version')"
          TGZ="dsh-code-server-app-$V.tgz"
          test -f "$TGZ" || { echo "::error::没有产出 $TGZ"; exit 1; }
          tar -tzf "$TGZ" | sed 's|^package/||' > /tmp/tar-list.txt
          node -e 'const fs=require("fs");const files=require("./package.json").files;const list=new Set(fs.readFileSync("/tmp/tar-list.txt","utf8").split("\n").filter(Boolean));const missing=files.filter(f=>!list.has(f)&&![...list].some(x=>x.startsWith(f.replace(/\/+$/,"")+"/")));if(missing.length){console.error("tarball 缺:",missing);process.exit(1)}console.log("tarball 清单完整:"+files.length+" 条")'
          ls -l "$TGZ"

      - name: 上传 tarball 产物
        uses: actions/upload-artifact@v7
        with:
          name: tarball-${{ github.ref_name }}-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 30
          path: dsh-code-server-app-*.tgz

      - name: 汇总(build)
        if: always()
        run: |
          {
            echo "### release / build"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 触发 | \`${{ github.event_name }}\` \`${{ github.ref_name }}\` |"
            echo "| 版本 | \`${{ steps.ver.outputs.version }}\` |"
            echo "| 树版本 | \`${{ steps.tree.outputs.tree_version }}\` |"
            echo "| UI 版本守卫 | \`${ui_version_check:-未执行}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ============================================================ 真装一遍(windows:产品发行的平台)
  install-smoke:
    name: install smoke (windows-latest)
    needs: build
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # 可选:钉住安装冒烟用的 DSH CLI 版本(默认 latest —— 用户装到的就是 latest,顺便当漂移探针)
      DSH_CLI_VERSION: ${{ vars.DSH_CLI_VERSION }}
    steps:
      - name: 检出(拿 scripts/test-installed.mjs 与 package.json)
        uses: actions/checkout@v7

      # DSH CLI 的 plugin 子命令是把参数转发给 profile 里的 pnpm ⇒ 这份 pnpm 得在 PATH 上。
      - name: 安装 pnpm
        uses: pnpm/action-setup@v6

      - name: 安装 Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 取回本 run 打好的 tarball
        uses: actions/download-artifact@v8
        with:
          name: tarball-${{ github.ref_name }}-${{ github.run_number }}
          path: .

      - name: 部署真 DSH(隔离的 DSH_HOME,不碰别的 profile)
        shell: pwsh
        run: |
          # 变量别叫 $home:$HOME 在 PowerShell 里是**只读自动变量**,赋值会抛
          # SessionStateUnauthorizedAccessException;GitHub 的 pwsh 包装把错误升级为终止错误 ⇒ 整步失败
          # (0.3.47 第二次跑就是这么挂在"部署真 DSH"这一步的,而且它只是个建目录的步骤)。
          $dshHome = Join-Path $env:RUNNER_TEMP 'dshhome'
          New-Item -ItemType Directory -Force $dshHome | Out-Null
          "DSH_HOME=$dshHome" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-ChildItem -Filter *.tgz | Select-Object Name, @{n = 'MB'; e = { [math]::Round($_.Length / 1MB, 2) } }

      # 门禁 6:官方安装路径(与用户完全一致),装的是**刚打出来的本地 tgz** ——
      # 不必先发 npm(插件的依赖子包早就发过了)。这一步专门抓"仓库回归永远看不出"的安装类问题:
      # files 白名单漏产物、可选子树的依赖被 pnpm 丢掉(0.3.45 的 requires missing bindings)、
      # profile 的 hoisted 布局里解析不到运行时依赖。
      - name: 用官方路径把插件装进真 profile(dsh plugin --profile web add)
        shell: pwsh
        run: |
          $V = node -p "require('./package.json').version"
          $cli = if ($env:DSH_CLI_VERSION) { "@deepseek-ai/dsh@$env:DSH_CLI_VERSION" } else { '@deepseek-ai/dsh@latest' }
          $tgz = Join-Path $PWD "dsh-code-server-app-$V.tgz"
          if (-not (Test-Path $tgz)) { throw "tarball 不在:$tgz" }
          Write-Host "用 $cli 安装 dsh-code-server-app@$V"
          npx -y $cli plugin --profile web add $tgz

      - name: 安装冒烟断言(装完必须真的能用)
        shell: pwsh
        run: |
          $V = node -p "require('./package.json').version"
          node scripts/test-installed.mjs "$env:DSH_HOME\profiles\web" --version $V

      - name: 合成配置里必须真的出现本插件(cordis.patch.yml 生效)
        shell: pwsh
        run: |
          $cli = if ($env:DSH_CLI_VERSION) { "@deepseek-ai/dsh@$env:DSH_CLI_VERSION" } else { '@deepseek-ai/dsh@latest' }
          $dump = Join-Path $env:RUNNER_TEMP 'dump.yml'
          npx -y $cli --profile web --dump-config | Out-File -FilePath $dump -Encoding utf8
          if (-not (Select-String -Path $dump -Pattern '- id: code-server' -Quiet)) {
            throw "dump-config 里没有 '- id: code-server' —— 插件的 cordis.patch.yml 没进合成树"
          }
          Write-Host "合成树里出现 - id: code-server ✓($((Get-Content $dump).Count) 行)"

      - name: 汇总(install smoke)
        if: always()
        run: |
          {
            echo "### release / install smoke(windows-latest)"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 状态 | \`${{ job.status }}\` |"
            echo "| 结论 | 真 DSH 部署 + 官方路径安装 + test-installed 断言 + dump-config |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ============================================================ 发布(仅 tag 触发)
  publish:
    name: publish to npm (next) + GitHub Release
    needs: [build, install-smoke]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # 'token' ⇒ 用 NPM_TOKEN(不附 provenance);其它/未设置 ⇒ OIDC trusted publishing
      NPM_AUTH_MODE: ${{ vars.NPM_AUTH_MODE }}
    steps:
      - name: 检出
        uses: actions/checkout@v7

      - name: 安装 Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 取回 tarball(发的是安装冒烟验过的那一份)
        uses: actions/download-artifact@v8
        with:
          name: tarball-${{ github.ref_name }}-${{ github.run_number }}
          path: .

      - name: 准备 npm 凭据(仅 token 模式;OIDC 模式无需任何凭据)
        if: env.NPM_AUTH_MODE == 'token'
        run: |
          set -euo pipefail
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "::error::NPM_AUTH_MODE=token 但仓库没有 NPM_TOKEN secret"
            exit 1
          fi
          # .npmrc 被 .gitignore 排除;publish-plugin.mjs 见到它就自动 --userconfig
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > .npmrc
          echo "已写入 .npmrc(token 模式)"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 发布到 npm(dist-tag = next;latest 不动)
        run: |
          set -euo pipefail
          ls -l dsh-code-server-app-*.tgz
          if [ "${NPM_AUTH_MODE:-}" = "token" ]; then
            npm whoami --registry https://registry.npmjs.org/
            node scripts/publish-plugin.mjs
          else
            echo "认证:OIDC trusted publishing(附 provenance)"
            node scripts/publish-plugin.mjs --provenance
          fi
          echo "=== 当前标签 ==="
          npm dist-tag ls dsh-code-server-app

      # ---- Release:附 tarball,便于事后核对/回滚参考 -----------------------------------------
      - name: 创建 GitHub Release(附 tarball)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          V="$(node -p 'require("./package.json").version')"
          gh release create "$GITHUB_REF_NAME" "dsh-code-server-app-$V.tgz" \
            --title "$GITHUB_REF_NAME" --generate-notes

      - name: 汇总(publish)
        if: always()
        run: |
          V="$(node -p 'require("./package.json").version')"
          {
            echo "### release / publish"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 版本 | \`$V\` |"
            echo "| 认证 | \`${NPM_AUTH_MODE:-oidc(OIDC trusted publishing)}\` |"
            echo "| 状态 | \`${{ job.status }}\` |"
            echo ""
            if [ "${{ job.status }}" != "success" ]; then
              echo "**没有发布成功** —— npm 上应该还是上一个版本(发布步骤失败时请核对 \`npm dist-tag ls\`)。"
            else
              echo "已发 \`next\`;**\`latest\` 未动** —— 重启 dsh web 确认无误后再执行:"
              echo ""
              echo '```'
              echo "pnpm run promote -- $V"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
