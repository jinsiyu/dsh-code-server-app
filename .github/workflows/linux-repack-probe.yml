# linux-repack-probe.yml —— 手动/按需:在 Linux 上**试编**平台专属重打包包,只出结论,不发布。
#
# 为什么单独一个工作流:产品目前只打 win32(lib/vendored.json 的 targets + 插件
# optionalDependencies 全是 -win32-*),Linux 上 pnpm 会跳过那 16 个子包 ⇒ 插件装得上但
# sqlite3 / spdlog 等原生模块缺失,IDE server 起不来。要给 Linux 打包,先要回答:
#   · 哪些"平台专属"模块在 Linux 上**真的能编出 .node**(哪些是 Windows-only 语义,不该产 linux 包);
#   · 现有 vendor-repacks.mjs 的宿主路径在 ubuntu 上跑得通吗(工具链、kerberos 的 krb5 头文件等)。
# 所以这里跑的是**现有脚本的本尊**(不另写一套),而且:
#   ① 改动只发生在 $RUNNER_TEMP 下的**仓库副本**里(vendor-repacks 会重写 repack/**、
#      lib/vendored.json 与插件 package.json —— 探针不该把检出弄脏);
#   ② 不发布任何东西(没有 publish 步骤);
#   ③ 每个目标用**同架构宿主 runner**(linux-x64 → ubuntu-latest;linux-arm64 → ubuntu-24.04-arm),
#      避免 node-gyp 跨架构编译那堆坑;
#   ④ 源树让脚本自己准备:没有 --from 时它只从 vendor/vscode/package.json 读**版本号**,然后
#      npm install code-server@<版本> --ignore-scripts,再在 lib/vscode(+extensions)里解包内部依赖
#      (~1GB)并 rebuild。**不能拿发布用的树包当 --from**:那是精简树(copySlim 排除所有
#      node_modules),分析阶段会一个原生模块都找不到(探针第一次跑就是这么"绿着但什么都没测")。
#
# 产物:每个目标的 repack/tgz/*.tgz 作为 artifact(供下一阶段复用)+ 一份逐模块结论。
# 结论同时以 ::notice:: 打印 —— notice/annotation 在公开仓库上**不需要 token** 就能读
# (check-runs API),不必登录 UI 才能看到"哪些模块编不出来"。
name: linux-repack-probe

on:
  # 首次跑靠 push 触发(只盯本文件):workflow_dispatch 需要 UI 或带 token 的 API,
  # 而这条探针的价值就在于"推上去就有结论"。之后改本文件会重跑,也可以从 Actions 页面手动 dispatch。
  push:
    paths:
      - '.github/workflows/linux-repack-probe.yml'
  workflow_dispatch:
    inputs:
      upload_tgz:
        description: 把编出来的 tgz 也作为 artifact 上传(默认上传,便于下一阶段直接复用)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  probe:
    name: probe (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # 同架构宿主编译:runner 自带 gcc / python3,node-gyp 直接用宿主编译链
          - runner: ubuntu-latest
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: 检出
        uses: actions/checkout@v7

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6

      - name: 安装 Node 24 并缓存 pnpm store
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # 编译原生模块要的工具链:gcc/g++/make/python3 在 ubuntu runner 上自带;
      # kerberos(npm 包)在 Linux 上要 krb5 头文件,缺了会直接编不过。
      - name: 安装编译依赖(kerberos 需要 krb5 开发头文件)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libkrb5-dev

      - name: 安装依赖(拿树包版本,并让仓库依赖与 CI 一致)
        run: pnpm install --frozen-lockfile

      # vendor-repacks 会重写 lib/vendored.json 与插件 package.json(那是它的正常职责)⇒ 探针在副本里跑。
      - name: 复制仓库到 $RUNNER_TEMP(不弄脏检出)
        run: |
          mkdir -p "$RUNNER_TEMP/probe"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/probe"
          ls "$RUNNER_TEMP/probe"

      - name: 造 vendor/vscode 版本标记(脚本据此取完整源树)
        working-directory: ${{ runner.temp }}/probe
        run: |
          set -euo pipefail
          V="$(node -e 'const {createRequire}=require("node:module");const path=require("node:path");const req=createRequire(process.argv[1]+"/package.json");const p=req.resolve("@jinsiyu/dshcs-vscode-server/package.json");process.stdout.write(require(path.join(path.dirname(p),"vscode/package.json")).version)' "$GITHUB_WORKSPACE")"
          echo "内置树版本(code-server):$V"
          mkdir -p vendor/vscode
          node -e 'require("node:fs").writeFileSync("vendor/vscode/package.json", JSON.stringify({name:"dshcs-vscode-tree",private:true,version:process.argv[1]},null,2)+"\n")' "$V"
          cat vendor/vscode/package.json

      - name: 试编(脚本自行准备完整源树 + 只打本目标)
        id: repack
        working-directory: ${{ runner.temp }}/probe
        run: |
          set +e
          node scripts/vendor-repacks.mjs --target "${{ matrix.target }}" --pack 2>&1 \
            | tee "$RUNNER_TEMP/repack.log"
          code=${PIPESTATUS[0]}
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          echo "repack 退出码 $code"
          exit 0

      # 探针失败时最需要的是**脚本自己的报错**:日志在 artifact 里要鉴权才能下载,
      # 而 notice/annotation 公开可读(check-runs API)⇒ 尾部 40 行直接转成 notice。
      - name: repack.log 尾部(公开可读,不用登录 UI)
        if: always()
        run: |
          set +e
          echo "::notice::repack.log 尾部 40 行(退出码 ${{ steps.repack.outputs.exit }}):"
          tail -n 40 "$RUNNER_TEMP/repack.log" 2>/dev/null | sed 's/^/::notice:: /'

      # 哨兵:分析结果为空 = 探针没测到东西(参数/环境不对),必须报失败,不能"绿着什么都没测"。
      - name: 哨兵(分析结果不能为空)
        run: |
          set -euo pipefail
          specific="$(grep -acE '\[平台专属\]' "$RUNNER_TEMP/repack.log")"
          echo "分析出的平台专属模块:$specific 个"
          if [ "$specific" -eq 0 ]; then
            echo "::error::分析阶段没找到任何平台专属模块 —— 探针参数不对(源树没准备好?),这次结果无效"
            exit 1
          fi

      # 逐模块结论:脚本自己会打 "✓ <target>: <包> → <二进制>" 与 "⚠ <target>: <包> 未生成 .node 二进制"
      - name: 逐模块结论(转成 notice,公开可读)
        if: always()
        run: |
          set +e
          echo "::notice::${{ matrix.target }} 重打包集与分析结果:"
          grep -aE '^(重打包集|直装集|  [^ ]+@[^ ]+ → )' "$RUNNER_TEMP/repack.log" | head -40 | sed 's/^/::notice::/'
          ok="$(grep -acE "^  ✓ ${{ matrix.target }}:" "$RUNNER_TEMP/repack.log")"
          warn="$(grep -acE "^  ⚠ ${{ matrix.target }}:" "$RUNNER_TEMP/repack.log")"
          echo "::notice::${{ matrix.target }} 编出 .node 的模块 $ok 个,未产出二进制 $warn 个"
          grep -aE "^  ⚠ ${{ matrix.target }}:" "$RUNNER_TEMP/repack.log" | sed 's/^/::notice::未产出: /'
          echo "---- 面向人的可读输出 ----"
          grep -aE "^  ✓ ${{ matrix.target }}:|^  ⚠ ${{ matrix.target }}:" "$RUNNER_TEMP/repack.log" | head -40
          ls -l "$RUNNER_TEMP/probe/repack/tgz" 2>/dev/null | head -40

      - name: 结论写进 job summary
        if: always()
        run: |
          {
            echo "### linux-repack-probe:${{ matrix.target }}"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| runner | \`${{ matrix.runner }}\` |"
            echo "| 目标 | \`${{ matrix.target }}\` |"
            echo "| repack 退出码 | \`${{ steps.repack.outputs.exit }}\` |"
            echo "| 编出 .node 的模块 | \`$(grep -acE "^  ✓ ${{ matrix.target }}:" "$RUNNER_TEMP/repack.log")\` |"
            echo "| 未产出二进制 | \`$(grep -acE "^  ⚠ ${{ matrix.target }}:" "$RUNNER_TEMP/repack.log")\` |"
            echo ""
            echo '```'
            grep -aE "^  ✓ ${{ matrix.target }}:|^  ⚠ ${{ matrix.target }}:" "$RUNNER_TEMP/repack.log" | head -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传 tgz(下一阶段可直接复用)
        if: ${{ inputs.upload_tgz }}
        uses: actions/upload-artifact@v7
        with:
          name: linux-repacks-${{ matrix.target }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/probe/repack/tgz/*.tgz
            ${{ runner.temp }}/repack.log
