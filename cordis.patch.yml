# dsh-code-server bundle 配置层(随包分发,由 dsh.profile.bundles 应用)
# 插件行按包名引用,Node 从 profile 的 node_modules 解析安装后的代码。
- insert:
    - id: code-server
      name: dsh-code-server-app
      config:
        # VS Code 树的启动由插件自带的 lib/launcher.mjs 完成(0.2.0 起不再运行 code-server
        # 的 Node 服务层)。正常情况下无需配置 bin;它只是逃生舱:指向外部 code-server
        # 可执行文件 / out/node/entry.js 时,插件退回旧模型(不经 launcher)。
        # bin: ''
        #
        # ---- 服务方式(serve) ----
        # loopback(默认):插件自己起一个回环端口(host:port),右侧栏 iframe 跨源直连。
        # dsh          :把 IDE 挂到 DSH 自己的 HTTP 端口上(/code-server/*),复用 DSH 的
        #                Host/Origin + cookie 防护(requestRejection),没有额外端口;
        #                需要 DSH 提供 webServer 服务,缺失(如 desktop)时自动回退 loopback。
        # 也可在「设置 → 插件 → Code Server」卡片里切换(下次启动生效)。
        serve: loopback
        # loopback 模式的绑定地址:仅允许回环(auth=none 已不再支持口令认证)。
        host: 127.0.0.1
        # loopback 模式的端口;被占用时启动失败并给出诊断(不自动换端口)。
        port: 8090
        # 认证:0.2.0 起固定为 none —— 口令认证依赖的 argon2 已随 code-server 服务层移除。
        # 需要对外访问请用 serve: dsh(由 DSH 统一防护)。
        auth: none
        # VS Code 数据目录(隔离用户数据,不污染真实 VS Code 设置)。
        userDataDir: ''
        extensionsDir: ''
        # 界面语言(留空 = 跟随浏览器);如 zh-cn。
        locale: ''
        # 启动就绪探测超时(ms)。
        readyTimeoutMs: 60000
        # 注:窗口化打开(新标签页)与后台常驻(切标签不重载)由"设置 → 插件 → Code Server"
        # 卡片控制,持久化于官方 settings 域(命名空间 code-server,键 windowedOpen / keepResident,
        # 默认 false / true);此处不需配置,卡片修改即时生效。
        # 另:0.2.3 起不再兼容旧版 DSH(无 sidebarRightTabs/sidebarRight 服务的版本),
        # 旧版上只在设置页给一条升级提示,不提供任何入口,也不预启动 IDE。
